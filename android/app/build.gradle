plugins {
    id 'com.android.application'
}

def webUrl = project.findProperty('enruta.webUrl') ?: 'https://enrutadelivery.com/'

android {
    namespace 'pe.enrutadelivery.app'
    compileSdk 34

    defaultConfig {
        applicationId 'pe.enrutadelivery.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        buildConfigField "String", "WEB_URL", "\"${webUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
