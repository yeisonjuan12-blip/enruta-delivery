name = "enruta-delivery"
compatibility_date = "2026-11-15"
pages_build_output_dir = "dist"

# Base de datos D1: catálogo, configuración, usuarios, pedidos y auditoría.
[[d1_databases]]
binding = "DB"
database_name = "enruta-delivery"
database_id = "00000000-0000-0000-0000-000000000000"

# Imágenes nuevas subidas desde el panel (las antiguas viven en /data como assets).
[[kv_namespaces]]
binding = "IMAGENES"
id = "00000000000000000000000000000000"
